# Rex se entrena solo (gratis en un repositorio público): cada 30 min y cada vez que se sube un aporte o se cambia el código.
name: Entrenar a Rex
on:
  push:
    paths: ["rex/aprendizaje/**", "codigo/**"]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: entrenar-rex
  cancel-in-progress: false
jobs:
  entrenar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: ¿Hay algo nuevo desde la última vez?
        id: nuevo
        run: |
          A=$(cat rex/aprendizaje/*.json 2>/dev/null | sha1sum | cut -c1-12)
          C=$(find codigo -type f -not -path "*/node_modules/*" | sort | xargs cat | sha1sum | cut -c1-12)
          echo "aportes=$A" >> $GITHUB_OUTPUT; echo "codigo=$C" >> $GITHUB_OUTPUT
          VA=$(cat rex/.huella-aportes 2>/dev/null || true); VC=$(cat rex/.huella-codigo 2>/dev/null || true)
          if [ "$A" = "$VA" ] && [ "$C" = "$VC" ]; then echo "sigue=no" >> $GITHUB_OUTPUT; echo "Nada nuevo."; else echo "sigue=si" >> $GITHUB_OUTPUT; fi
          if [ "$C" != "$VC" ]; then echo "armar=si" >> $GITHUB_OUTPUT; else echo "armar=no" >> $GITHUB_OUTPUT; fi
      - name: Juntar lo que aprendió cada equipo
        if: steps.nuevo.outputs.sigue == 'si'
        run: python3 rex/entrenar.py
      - name: Todas las pruebas
        if: steps.nuevo.outputs.sigue == 'si'
        id: pruebas
        run: node codigo/tests/correr.js --informe rex/RESULTADOS.md --curva rex/curva.json
      - name: Armar la página (solo si cambió el código y todas las pruebas pasaron)
        if: steps.nuevo.outputs.armar == 'si' && steps.pruebas.outcome == 'success'
        run: cd codigo && python3 build.py --preprod=..
      - name: Guardar
        if: always() && steps.nuevo.outputs.sigue == 'si'
        run: |
          echo "${{ steps.nuevo.outputs.aportes }}" > rex/.huella-aportes
          if [ "${{ steps.pruebas.outcome }}" = "success" ]; then echo "${{ steps.nuevo.outputs.codigo }}" > rex/.huella-codigo; fi
          git config user.name "Rex (entrenamiento automático)"
          git config user.email "rex@users.noreply.github.com"
          git add rex index.html version.json robots.txt .nojekyll 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Rex se entrenó: $(date -u +%Y-%m-%d\ %H:%M) UTC"
          git push
      - name: Publicar la página nueva (GitHub Pages)
        if: steps.nuevo.outputs.armar == 'si' && steps.pruebas.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "(Pages se publica solo)"
