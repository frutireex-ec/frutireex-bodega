# OPCIONAL: Claude le enseña a Rex lo de rex/PENDIENTES.md y abre un PR (no publica nada solo: el dueño lo revisa y lo junta).
# Usa la suscripción de Claude del dueño (sin costo extra). Para prenderlo, UNA vez y a mano:
#   1) instalar la app de Claude en este repositorio: https://github.com/apps/claude
#   2) en una PC con Claude Code: `claude setup-token` y guardar ese token como secreto del repositorio CLAUDE_CODE_OAUTH_TOKEN
#      (Settings → Secrets and variables → Actions → New repository secret). Sin el secreto, esta acción no hace nada.
name: Rex aprende frases nuevas (Claude)
on:
  schedule:
    - cron: "17 3 * * *"     # una vez al día (madrugada de Ecuador)
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: read
  id-token: write
jobs:
  agente:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: ¿Está prendido?
        id: prendido
        run: |
          if [ -n "$TOKEN" ]; then echo "si=1" >> $GITHUB_OUTPUT; else echo "Falta el secreto CLAUDE_CODE_OAUTH_TOKEN, no se hace nada."; fi
      - uses: actions/checkout@v4
        if: steps.prendido.outputs.si == '1'
      - uses: actions/setup-node@v4
        if: steps.prendido.outputs.si == '1'
        with: { node-version: "20" }
      - uses: anthropics/claude-code-action@v1
        if: steps.prendido.outputs.si == '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/entrenar-rex"
          claude_args: "--max-turns 40"
